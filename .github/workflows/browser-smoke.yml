name: Browser Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'assets/**'
      - 'data/**'
      - 'tests/browser-smoke.spec.js'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'assets/**'
      - 'data/**'
      - 'tests/browser-smoke.spec.js'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lineup-http.log 2>&1 &
          echo $! > /tmp/lineup-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/lineup-http.log
          exit 1

      - name: Run Chromium smoke tests
        run: npx playwright test tests/browser-smoke.spec.js --reporter=line --workers=1

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: |
            test-results/*.png
            test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/lineup-http.log || true
